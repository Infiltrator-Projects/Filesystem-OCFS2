# SPDX-License-Identifier: GPL-3.0-or-later
name: OCFS2 Common V2 recognition qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 4ee7591678a44af92d94eec84a8e94ccd6349e37
          path: Libraries
          persist-credentials: false
      - name: Native Common V2 hosted and import-free checks
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent formatter image (test oracle only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocfs2-tools
          truncate -s 134217728 build/foreign.img
          mkfs.ocfs2 -F -M local -N 1 -b 4096 -C 4096 build/foreign.img
          sha256sum build/foreign.img > build/before
          build/test_ocfs2 ./build/OCFS2.so build/foreign.img
          build/test_ocfs2 ./build/freestanding/OCFS2.so build/foreign.img
          sha256sum -c build/before
      - name: Independent local baseline namespace (test oracle only)
        run: |
          set -euo pipefail
          truncate -s 134217728 build/local.img
          mkfs.ocfs2 -F -M local -N 1 -b 4096 -C 4096 --fs-feature-level=max-compat build/local.img
          od -Ax -tx4 -j 8384 -N 80 build/local.img
          debugfs.ocfs2 -R 'stats' build/local.img
          debugfs.ocfs2 -R 'ls //' build/local.img
          debugfs.ocfs2 -R 'stat //global_bitmap' build/local.img
          debugfs.ocfs2 -R 'stat //journal:0000' build/local.img
          debugfs.ocfs2 -R 'dump //journal:0000 build/journal.bin' build/local.img
          od -Ax -tx1 -N 80 build/journal.bin
          sha256sum build/local.img > build/local-before
          build/test_ocfs2 ./build/OCFS2.so build/local.img mount
          build/test_ocfs2 ./build/freestanding/OCFS2.so build/local.img mount
          sha256sum -c build/local-before
      - name: Sanitizer qualification
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  publish:
    needs: recognition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 4ee7591678a44af92d94eec84a8e94ccd6349e37
          path: Libraries
          persist-credentials: false
      - name: Build, test and publish the exact native provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Published version is immutable; increment VERSION for another release."
            exit 0
          fi
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          sh scripts/build-release.sh portable dist
          common=$(git -C Libraries rev-parse HEAD)
          curl -fsSL --retry 3 "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" -o "$work/source.tar.gz"
          curl -fsSL --retry 3 "https://codeload.github.com/Infiltrator-Projects/Libraries/tar.gz/$common" -o "$work/common.tar.gz"
          source_hash=$(sha256sum "$work/source.tar.gz" | cut -d' ' -f1)
          common_hash=$(sha256sum "$work/common.tar.gz" | cut -d' ' -f1)
          run="dist/filesystem-ocfs2-$version-native-installer.run"
          sed -e "s/@SOURCE@/$GITHUB_SHA/g" -e "s/@COMMON@/$common/g" -e "s/@SOURCE_HASH@/$source_hash/g" -e "s/@COMMON_HASH@/$common_hash/g" -e "s/@VERSION@/$version/g" scripts/installer.in > "$run"
          chmod +x "$run"
          "$run" --profile aggressive --system-package-mode --build-only --output "$work/native"
          deb="infiltrator-filesystem-ocfs2_${version}_amd64.deb"
          pdf="System/Resources/Documentation/Filesystem-OCFS2.pdf"
          so="System/Filesystems/OCFS2.so"
          for package in "dist/$deb" "$work/native/$deb"; do
            test "$(dpkg-deb -f "$package" Package)" = 'infiltrator-filesystem-ocfs2'
            test "$(dpkg-deb -f "$package" Version)" = "$version"
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            expected=$(printf './%s\n' "$pdf" "$so" | sort)
            actual=$(dpkg-deb --fsys-tarfile "$package" | tar -tf - | grep -v '/$' | sort)
            test "$actual" = "$expected"
            dpkg-deb -x "$package" "$work/extract"
            cmp "docs/OCFS2.pdf" "$work/extract/$pdf"
            test "$(nm -D --defined-only "$work/extract/$so" | awk '{print $3}')" = infiltrator_filesystem_api_v2
          done
          test ! -e "/$pdf"
          test ! -e "/$so"
          sudo dpkg -i "$work/native/$deb"
          cmp "docs/OCFS2.pdf" "/$pdf"
          cmp "$work/extract/$so" "/$so"
          sudo dpkg --purge infiltrator-filesystem-ocfs2
          test ! -e "/$pdf"
          test ! -e "/$so"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gh release create "v$version" --target "$GITHUB_SHA" --title "OCFS2 v$version" --notes "Bounded local single-slot OCFS2 read-only 4 KiB profile. Native cluster bitmap, journal admission, namespace and extent reads. Independent empty formatter and populated structural tests required by release CI; independent populated media, clustered locking, mutation and physical BOOT remain unqualified." "dist/$deb" "$run"
